[tox]
envlist =
    py33-django16,
    py33-django17c1

[testenv]
deps=-r{toxinidir}/requirements.txt
     -r{toxinidir}/requirements-test.txt

commands=
    {envbindir}/python manage.py loaddata production
    {envbindir}/python manage.py loaddata debug
    {envbindir}/coverage run --source=src/kawaz runtests.py []

[testenv16]
deps={[testenv]deps}
commands=
    {envbindir}/python manage.py syncdb --noinput
    {envbindir}/python manage.py loaddata production
    {envbindir}/python manage.py loaddata debug
    {envbindir}/coverage run --source=src/kawaz runtests.py []

[testenv17]
deps={[testenv]deps}
commands=
    {envbindir}/python manage.py migrate
    {envbindir}/python manage.py loaddata production
    {envbindir}/python manage.py loaddata debug
    {envbindir}/coverage run --source=src/kawaz runtests.py []

[django16]
deps= 
    django==1.6
    {[testenv16]deps}

[django17c1]
deps= 
    https://www.djangoproject.com/download/1.7c1/tarball/
    {[testenv17]deps}

[testenv:py33-django16]
basepython=python3.3
deps={[django16]deps}

[testenv:py33-django17c1]
basepython=python3.3
deps={[django17c1]deps}
